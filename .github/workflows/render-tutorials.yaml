name: Update tutorials

on:
  push:
    branches: [main]
    paths:
      - "vignettes/**"
      - ".github/workflows/render-tutorials.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-tutorials
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install rendering packages
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      - name: Render tutorials
        shell: Rscript {0}
        run: |
          files <- list.files("vignettes", pattern = "\\.Rmd$", full.names = TRUE)

          for (file in files) {
            output <- rmarkdown::render(
              file,
              output_format = rmarkdown::github_document(html_preview = FALSE),
              envir = new.env(parent = globalenv()),
              quiet = TRUE
            )

            text <- readLines(output, warn = FALSE)
            text <- gsub("\\.html(?=[)#])", ".md", text, perl = TRUE)
            writeLines(text, output)
          }

      - name: Commit generated tutorials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vignettes/
          if ! git diff --cached --quiet; then
            git commit -m "Update generated tutorials"
            git push
          fi